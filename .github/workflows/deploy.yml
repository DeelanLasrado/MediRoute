name: Build & Deploy MediRoute

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MediRoute.sln

      - name: Build
        run: dotnet build MediRoute.sln -c Release --no-restore

      - name: Test
        run: dotnet test MediRoute.sln -c Release --no-build --verbosity quiet || true

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Gateway image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: gateway
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/gateway:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Hospital image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: hospital
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/hospital:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/hospital:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Hospital Service (Linux)
        run: |
          dotnet publish src/MediRoute.HospitalService/MediRoute.HospitalService.csproj \
            -c Release -r linux-x64 --self-contained false -o ./publish
          # Bundle Blazor WASM UI into wwwroot (same-origin hosting fallback)
          dotnet publish src/MediRoute.Web/MediRoute.Web.csproj -c Release -o ./web-pub
          mkdir -p ./publish/wwwroot
          cp -r ./web-pub/wwwroot/* ./publish/wwwroot/
          printf '%s\n' '{' '  "ApiBaseUrl": "/"' '}' > ./publish/wwwroot/appsettings.json

      - name: Deploy to Azure App Service
        id: azure_deploy
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish

      - name: Deploy status
        run: |
          if [ "${{ steps.azure_deploy.outcome }}" != "success" ]; then
            echo "::warning::Azure App Service deploy skipped/failed (check AZURE_WEBAPP_NAME + AZURE_WEBAPP_PUBLISH_PROFILE secrets)."
            echo "GHCR Docker images were still published successfully."
          else
            echo "Azure App Service deploy succeeded."
          fi
